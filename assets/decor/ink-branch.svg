<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" fill="none">
  <!-- 水墨梅枝：折笔老干 + 没骨花瓣 + 金蕊 -->
  <g stroke="#4f6673" stroke-linecap="round">
    <!-- 老干：折笔两段，粗细变化 -->
    <path d="M214 10 C176 34 150 52 128 84 C112 106 104 128 100 152" stroke-width="3.4" opacity=".7"/>
    <path d="M128 84 C114 82 96 86 78 98" stroke-width="2.2" opacity=".6"/>
    <path d="M150 56 C142 44 130 36 114 32" stroke-width="1.8" opacity=".55"/>
    <path d="M100 152 C96 168 96 184 100 202" stroke-width="1.6" opacity=".5"/>
    <!-- 细梢 -->
    <path d="M78 98 C68 104 60 114 56 126" stroke-width="1.1" opacity=".5"/>
    <path d="M114 32 C104 28 92 28 82 32" stroke-width="1" opacity=".45"/>
  </g>
  <!-- 没骨梅花：陶土晕染 -->
  <g fill="#a96f56">
    <g opacity=".5">
      <circle cx="78" cy="96" r="5.2"/><circle cx="70" cy="102" r="4.6"/><circle cx="80" cy="106" r="4.8"/><circle cx="87" cy="100" r="4.4"/><circle cx="76" cy="88" r="4.2"/>
    </g>
    <g opacity=".42">
      <circle cx="116" cy="30" r="4.6"/><circle cx="109" cy="36" r="4.2"/><circle cx="118" cy="40" r="4.4"/><circle cx="124" cy="33" r="4"/>
    </g>
    <g opacity=".36">
      <circle cx="57" cy="124" r="4"/><circle cx="51" cy="130" r="3.6"/><circle cx="60" cy="133" r="3.8"/>
    </g>
    <!-- 花苞 -->
    <circle cx="100" cy="200" r="3.4" opacity=".5"/>
    <circle cx="84" cy="32" r="2.6" opacity=".45"/>
    <circle cx="140" cy="70" r="2.4" opacity=".4"/>
  </g>
  <!-- 金蕊 -->
  <g fill="#a99979" opacity=".85">
    <circle cx="78" cy="98" r="1.7"/>
    <circle cx="117" cy="35" r="1.5"/>
    <circle cx="57" cy="129" r="1.3"/>
  </g>
</svg>