<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 90" fill="none">
  <!-- 水墨飞燕：笔锋式剪影，双翼扫笔 + 剪尾 -->
  <g fill="#234b62">
    <!-- 左翼：一笔扫出，起笔重收笔轻 -->
    <path d="M62 40 C48 26 30 14 8 10 C24 22 38 32 50 42 C54 45 59 44 62 40 Z" opacity=".82"/>
    <!-- 右翼：上扬挑笔 -->
    <path d="M74 38 C84 22 100 10 124 6 C106 20 92 32 82 44 C78 48 74 44 74 38 Z" opacity=".7"/>
    <!-- 身躯：中锋一点 -->
    <path d="M60 42 C64 36 74 34 80 40 C84 45 82 52 74 55 C66 58 58 50 60 42 Z" opacity=".9"/>
    <!-- 剪尾：两笔分锋 -->
    <path d="M70 54 C64 64 54 74 40 82 C52 76 62 70 70 62 Z" opacity=".78"/>
    <path d="M76 55 C78 66 84 76 94 84 C88 74 84 66 82 58 Z" opacity=".66"/>
    <!-- 喙 -->
    <path d="M80 40 L90 37 L81 44 Z" opacity=".85"/>
  </g>
  <!-- 飞白：翼尖枯笔 -->
  <g stroke="#234b62" stroke-linecap="round" opacity=".3">
    <path d="M14 13 C22 17 30 22 37 27" stroke-width="1.1"/>
    <path d="M112 12 C104 17 97 23 91 29" stroke-width=".9"/>
  </g>
</svg>